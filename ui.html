<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 도우미</title>
<style>
:root {
  --bg: #faf7f2; --panel: #ffffff; --line: #e8e1d6; --ink: #2f2a25; --sub: #8a8178;
  --accent: #e08aa0; --accent-ink: #ffffff; --soft: #fbeef1; --ok: #6aa984; --err: #d06464; --chip: #f3efe8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1f1d1b; --panel: #2a2725; --line: #3b3734; --ink: #ece6de; --sub: #a49b91;
          --accent: #e08aa0; --accent-ink: #1f1d1b; --soft: #3a2d31; --chip: #34302d; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; display: flex; }
nav { width: 92px; border-right: 1px solid var(--line); padding: 10px 6px; display: flex; flex-direction: column; gap: 4px; flex: none; }
nav button { border: 0; background: none; color: var(--sub); padding: 8px 4px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
nav button.on { background: var(--soft); color: var(--ink); font-weight: bold; }
nav .grow { flex: 1; }
nav .claude { font-size: 11px; text-align: center; color: var(--sub); }
nav .claude.bad { color: var(--err); }
main { flex: 1; overflow: auto; padding: 14px 18px 40px; }
section { display: none; max-width: 1100px; }
section.on { display: block; }
h2 { font-size: 15px; margin: 0 0 10px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
textarea, input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; background: var(--panel); color: var(--ink); }
textarea { resize: vertical; }
label.small { font-size: 12px; color: var(--sub); display: block; margin: 8px 0 4px; }
button.btn { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: bold; padding: 8px 18px; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.hint { font-size: 12px; color: var(--sub); }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 92px; }
.drop.over { border-color: var(--accent); background: var(--soft); }
.thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; background: var(--chip); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb b { position: absolute; left: 3px; top: 2px; font-size: 11px; color: #fff; text-shadow: 0 0 3px #000; }
.thumb button { position: absolute; right: 2px; top: 2px; border: 0; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; line-height: 18px; padding: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
.plats label { background: var(--chip); border-radius: 16px; padding: 4px 10px; cursor: pointer; user-select: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { margin: 0; font-size: 14px; }
.card .st { font-size: 12px; color: var(--sub); }
.card .st.err { color: var(--err); white-space: pre-wrap; }
.card textarea { min-height: 300px; font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { border: 1px solid var(--line); background: none; color: var(--sub); border-radius: 14px; padding: 2px 9px; font: inherit; font-size: 12px; cursor: pointer; }
.chips button:hover { color: var(--ink); border-color: var(--accent); }
.count { font-size: 11px; color: var(--sub); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -1px; }
@keyframes s { to { transform: rotate(360deg); } }
.list .item { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.list .item:last-child { border: 0; }
.list .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .item.click { cursor: pointer; }
.list .item.click:hover { background: var(--soft); }
.tag { font-size: 11px; background: var(--chip); border-radius: 10px; padding: 1px 7px; color: var(--sub); }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 9; }
</style>
</head>
<body>
<nav>
  <button data-tab="write" class="on">✍ 쓰기</button>
  <button data-tab="voice">🗣 내 말투</button>
  <button data-tab="posts">📂 지난 글</button>
  <div class="grow"></div>
  <div class="claude" id="claude"></div>
</nav>
<main>
  <section id="write" class="on">
    <div class="box">
      <div class="row between"><h2 id="postName">새 글</h2><button class="btn" id="newPost">＋ 새 글</button></div>
      <label class="small">메모 — 직접 겪은 사실일수록 내 글 같아집니다(가격·시간·아쉬운 점·작은 디테일). 협찬이면 <code>#협찬</code></label>
      <textarea id="memo" rows="4" placeholder="예) 을지로 OO집 김치찌개 7천원. 점심 웨이팅 20분. 고기 많음, 국물은 좀 짰음. 공깃밥 리필 무료"></textarea>
      <label class="small">제목 후보(비워도 됨)</label>
      <input type="text" id="title">
      <label class="small">사진 — 끌어다 놓거나 고르세요(앞 10장을 봅니다, 순서 = 글 순서)</label>
      <div class="drop" id="drop">
        <button class="btn" id="pick">사진 고르기</button>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
      </div>
      <label class="small">어디에 올릴 글?</label>
      <div class="row plats" id="plats"></div>
      <div class="row" style="margin-top:12px"><button class="btn main" id="go">글 만들기</button><span class="hint" id="goHint"></span></div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="voice">
    <div class="box">
      <h2>내 말투</h2>
      <p class="hint">예전에 직접 쓴 글을 3~10편 넣어 두면 그 말투(문장 길이·끝맺음·이모지 습관)를 따라 씁니다. 내용은 가져오지 않습니다. 최근 5편을 씁니다.</p>
      <label class="small">말투 메모</label>
      <div class="row"><input type="text" id="voiceNote" placeholder="예) ~했어요 체, 이모지 거의 안 씀, 문단 짧게" style="flex:1"><button class="btn" id="saveNote">저장</button></div>
      <label class="small">내가 쓴 글 붙여넣기</label>
      <textarea id="voiceText" rows="6"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn main" id="addVoice">넣기</button></div>
    </div>
    <div class="box list" id="voiceList"></div>
    <div class="box">
      <h2>설정</h2>
      <label class="small">네이버 카페 글쓰기 주소(카페마다 다름 — 카페 글쓰기 화면 주소를 붙여 넣으세요)</label>
      <div class="row"><input type="text" id="cafeUrl" placeholder="https://cafe.naver.com/..." style="flex:1"><button class="btn" id="saveCafe">저장</button></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="openData">데이터 폴더 열기</button>
        <span class="hint">올리기는 직접 합니다 — 자동 발행은 계정 정지 위험 때문에 일부러 넣지 않았습니다.</span></div>
    </div>
  </section>

  <section id="posts">
    <div class="box list" id="postList"></div>
  </section>
</main>
<div id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
const QUICK = [["짧게", "지금 길이의 절반 정도로 줄여 줘"], ["길게", "조금 더 자세하게 늘려 줘. 재료에 없는 사실은 넣지 말고"],
               ["캐주얼하게", "더 편하고 친근한 말투로"], ["정중하게", "조금 더 정중한 말투로"],
               ["첫 문장 다시", "첫 문장을 더 눈길 가게 다시 써 줘"], ["해시태그 다시", "본문은 그대로 두고 해시태그만 다시 골라 줘"]];
let S = { platforms: [], config: {}, name: "", photos: [], texts: {}, busy: {} };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(t) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = "none", 2200); }
async function api(path, body, raw) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "X-Token": TOKEN }, body: raw ? body : JSON.stringify(body) };
  if (body !== undefined && !raw) opt.headers["Content-Type"] = "application/json";
  const r = await fetch(path, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("오류 " + r.status));
  return d;
}
const fail = e => toast(e.message || String(e));

// 탭
document.querySelectorAll("nav button[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button[data-tab]").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === b.dataset.tab));
  if (b.dataset.tab === "posts") loadPosts();
});

// 창이 열려 있다는 신호(끊기면 서버가 스스로 끝난다)
setInterval(() => fetch("/api/ping").catch(() => {}), 10000);
fetch("/api/ping");

async function loadState() {
  const d = await api("/api/state");
  S.platforms = d.platforms; S.config = d.config;
  const c = $("#claude");
  c.textContent = d.claude ? "claude 연결됨" : "claude 없음";
  c.className = "claude" + (d.claude ? "" : " bad");
  c.title = d.claude || d.no_claude;
  if (!d.claude) toast(d.no_claude);
  $("#plats").innerHTML = d.platforms.map(p =>
    `<label><input type="checkbox" value="${esc(p.id)}" ${d.config.default_platforms.includes(p.id) ? "checked" : ""}> ${esc(p.name)}</label>`).join("");
  $("#voiceNote").value = d.config.voice_note || "";
  $("#cafeUrl").value = (d.config.write_urls || {}).naver_cafe || "";
  $("#voiceList").innerHTML = d.voice.length ? "<h2>넣은 글 " + d.voice.length + "편</h2>" + d.voice.map(v =>
    `<div class="item"><span class="t">${esc(v.text.replace(/\s+/g, " ").slice(0, 120))}</span><button class="btn" data-del="${esc(v.name)}">빼기</button></div>`).join("")
    : '<p class="hint">아직 넣은 글이 없습니다. 없어도 쓸 수 있지만, 넣으면 내 글처럼 나옵니다.</p>';
  $("#voiceList").querySelectorAll("[data-del]").forEach(b => b.onclick = () =>
    api("/api/voice/delete", { name: b.dataset.del }).then(loadState).catch(fail));
}

// ---------- 쓰기 ----------
function renderPhotos() {
  const drop = $("#drop");
  drop.querySelectorAll(".thumb").forEach(t => t.remove());
  S.photos.forEach((f, i) => {
    const t = document.createElement("div");
    t.className = "thumb";
    t.innerHTML = `<img src="/api/photo?name=${encodeURIComponent(S.name)}&file=${encodeURIComponent(f)}"><b>${i + 1}</b><button title="빼기">✕</button>`;
    t.querySelector("button").onclick = () => api("/api/photo/delete", { name: S.name, file: f })
      .then(() => { S.photos = S.photos.filter(x => x !== f); renderPhotos(); }).catch(fail);
    drop.insertBefore(t, $("#pick"));
  });
}

async function ensurePost() {
  const memo = $("#memo").value, title = $("#title").value;
  if (!S.name) {
    S.name = (await api("/api/post/new", { memo, title })).name;
    $("#postName").textContent = S.name;
  } else {
    await api("/api/post/save", { name: S.name, memo, title });
  }
}

async function addFiles(files) {
  files = [...files].filter(f => /^image\/(jpeg|png|webp|gif)$/.test(f.type));
  if (!files.length) return toast("jpg·png·webp·gif 사진만 넣을 수 있습니다.");
  try {
    await ensurePost();
    for (const f of files) {
      const d = await api(`/api/photo?name=${encodeURIComponent(S.name)}&file=${encodeURIComponent(f.name)}`, f, true);
      S.photos.push(d.file);
      renderPhotos();
    }
  } catch (e) { fail(e); }
}
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
const drop = $("#drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };
document.addEventListener("paste", e => {
  if (!$("#write").classList.contains("on")) return;
  const fs = [...(e.clipboardData?.files || [])];
  if (fs.length) { e.preventDefault(); addFiles(fs); }
});

$("#newPost").onclick = () => {
  if (Object.values(S.busy).some(Boolean)) return toast("글을 만드는 중입니다. 끝난 뒤에 새 글을 여세요.");
  S.name = ""; S.photos = []; S.texts = {};
  $("#memo").value = ""; $("#title").value = ""; $("#postName").textContent = "새 글";
  renderPhotos(); $("#cards").innerHTML = "";
};

$("#go").onclick = async () => {
  const pids = [...document.querySelectorAll("#plats input:checked")].map(x => x.value);
  if (!pids.length) return toast("어디에 올릴 글인지 하나 이상 고르세요.");
  if (!$("#memo").value.trim() && !S.photos.length) return toast("메모나 사진을 넣어 주세요.");
  $("#go").disabled = true;
  try {
    await ensurePost();
    api("/api/config", { default_platforms: pids }).catch(() => {});
    const { job } = await api("/api/gen", { name: S.name, platforms: pids });
    pids.forEach(p => { S.busy[p] = true; S.texts[p] = S.texts[p] || ""; card(p, "running"); });
    $("#goHint").innerHTML = '<span class="spin"></span> 쓰는 중… (사진이 많으면 1분쯤)';
    poll(job, S.name);
  } catch (e) { fail(e); $("#go").disabled = false; }
};

async function poll(job, name) {
  let d;
  try { d = await api("/api/job?id=" + job); } catch (e) { fail(e); $("#go").disabled = false; return; }
  if (name !== S.name) return;
  let running = 0;
  for (const [p, v] of Object.entries(d)) {
    if (v.status === "running") { running++; continue; }
    if (!S.busy[p]) continue;
    S.busy[p] = false;
    if (v.status === "done") S.texts[p] = v.text;
    card(p, v.status, v.error);
  }
  if (running) return setTimeout(() => poll(job, name), 2000);
  $("#go").disabled = false; $("#goHint").textContent = "";
}

function plat(p) { return S.platforms.find(x => x.id === p) || { id: p, name: p }; }

function card(p, status, error) {
  let c = document.getElementById("card-" + p);
  if (!c) {
    c = document.createElement("div");
    c.className = "card"; c.id = "card-" + p;
    c.innerHTML = `<div class="row between"><h3>${esc(plat(p).name)}</h3><span class="count"></span></div>
      <div class="st"></div>
      <textarea spellcheck="false"></textarea>
      <div class="chips">${QUICK.map(([l, t]) => `<button data-q="${esc(t)}">${esc(l)}</button>`).join("")}</div>
      <div class="row"><input type="text" class="ins" placeholder="다듬기 — 예) 가격 얘기를 앞으로, 반말로" style="flex:1"><button class="btn rf">다듬기</button></div>
      <div class="row"><button class="btn main cp">복사</button><button class="btn wr">글쓰기 창 열기</button><button class="btn fd">사진 폴더</button></div>`;
    const ta = c.querySelector("textarea");
    ta.oninput = () => { S.texts[p] = ta.value; count(c, ta.value); clearTimeout(ta.h); ta.h = setTimeout(() =>
      api("/api/text", { name: S.name, platform: p, text: ta.value }).catch(fail), 800); };
    c.querySelectorAll("[data-q]").forEach(b => b.onclick = () => refine(p, b.dataset.q));
    c.querySelector(".rf").onclick = () => refine(p, c.querySelector(".ins").value);
    c.querySelector(".ins").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) refine(p, e.target.value); };
    c.querySelector(".cp").onclick = () => navigator.clipboard.writeText(ta.value).then(() => toast("복사했습니다 — 글쓰기 창에 붙여 넣으세요."), fail);
    c.querySelector(".wr").onclick = () => api("/api/open", { what: "write", platform: p }).catch(fail);
    c.querySelector(".fd").onclick = () => api("/api/open", { what: "folder", name: S.name }).catch(fail);
    $("#cards").appendChild(c);
  }
  const ta = c.querySelector("textarea"), st = c.querySelector(".st");
  const busy = status === "running";
  c.querySelectorAll("button, input, textarea").forEach(x => x.disabled = busy);
  st.className = "st" + (status === "error" ? " err" : "");
  st.innerHTML = busy ? '<span class="spin"></span> 쓰는 중…' : status === "error" ? esc(error || "실패했습니다.") :
    (/\[확인:/.test(S.texts[p] || "") ? "⚠ <b>[확인: …]</b> 자리는 직접 채우세요." : "");
  if (!busy) { ta.value = S.texts[p] || ""; count(c, ta.value); }
}
function count(c, t) { c.querySelector(".count").textContent = t ? t.replace(/\s/g, "").length + "자(공백 제외)" : ""; }

async function refine(p, instruction) {
  if (!instruction.trim()) return toast("어떻게 다듬을지 적어 주세요.");
  const c = document.getElementById("card-" + p);
  S.busy[p] = true; card(p, "running");
  try {
    const r = await api("/api/refine", { name: S.name, platform: p, instruction, text: S.texts[p] || "" });
    S.busy[p] = false;
    if (r.text) { S.texts[p] = r.text; c.querySelector(".ins").value = ""; card(p, "done"); }
    else card(p, "error", r.error);
  } catch (e) { S.busy[p] = false; card(p, "done"); fail(e); }
}

// ---------- 내 말투 ----------
$("#addVoice").onclick = () => api("/api/voice", { text: $("#voiceText").value })
  .then(() => { $("#voiceText").value = ""; toast("넣었습니다."); loadState(); }).catch(fail);
$("#saveNote").onclick = () => api("/api/config", { voice_note: $("#voiceNote").value }).then(() => toast("저장했습니다.")).catch(fail);
$("#saveCafe").onclick = () => {
  const u = $("#cafeUrl").value.trim();
  if (u && !u.startsWith("https://")) return toast("https:// 로 시작하는 주소를 넣어 주세요.");
  api("/api/config", { write_urls: Object.assign({}, S.config.write_urls, { naver_cafe: u }) }).then(() => { toast("저장했습니다."); loadState(); }).catch(fail);
};
$("#openData").onclick = () => api("/api/open", { what: "data" }).catch(fail);

// ---------- 지난 글 ----------
async function loadPosts() {
  const rows = await api("/api/posts").catch(e => { fail(e); return []; });
  $("#postList").innerHTML = rows.length ? rows.map(r =>
    `<div class="item click" data-name="${esc(r.name)}"><span class="tag">${esc(r.name.slice(0, 8))}</span><span class="t">${esc(r.memo || "(메모 없음)")}</span>` +
    r.platforms.map(p => `<span class="tag">${esc(plat(p).name)}</span>`).join("") + (r.photos ? `<span class="tag">사진 ${r.photos}</span>` : "") + "</div>").join("")
    : '<p class="hint">아직 만든 글이 없습니다.</p>';
  $("#postList").querySelectorAll("[data-name]").forEach(el => el.onclick = () => openPost(el.dataset.name));
}
async function openPost(name) {
  if (Object.values(S.busy).some(Boolean)) return toast("글을 만드는 중입니다. 끝난 뒤에 여세요.");
  try {
    const d = await api("/api/post?name=" + encodeURIComponent(name));
    S.name = d.name; S.photos = d.photos; S.texts = d.texts;
    $("#memo").value = d.memo; $("#title").value = d.title; $("#postName").textContent = d.name;
    renderPhotos(); $("#cards").innerHTML = "";
    Object.keys(d.texts).forEach(p => card(p, "done"));
    document.querySelector('nav button[data-tab="write"]').click();
  } catch (e) { fail(e); }
}

loadState().catch(fail);
</script>
