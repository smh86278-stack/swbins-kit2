name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # 사진 시험(PhotoTest)용. 앱 서버·시험의 나머지는 표준 라이브러리만 쓴다
      - name: Install Pillow
        run: python -m pip install pillow

      # 진짜 AI 는 부르지 않는다 — test_ai 는 가짜 CLI·가짜 Ollama 서버
      - name: unittest
        run: python -m unittest discover tests -v
