name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # 사진 시험(PhotoTest)용. 앱 서버·시험의 나머지는 표준 라이브러리만 쓴다
      - name: Install Pillow
        run: python -m pip install pillow

      # 진짜 AI 는 부르지 않는다 — test_ai 는 가짜 CLI·가짜 Ollama 서버
      - name: unittest
        run: python -m unittest discover tests -v

  # 빌드(윈도우 exe · 맥 .app)가 실제로 만들어지고, 만든 앱이 창 없이 떠서 화면·API 가 오는지
  build:
    name: build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install pillow pyinstaller playwright
          python -m playwright install chromium

      - name: Smoke (source)
        shell: bash
        run: python tests/smoke.py --os ${{ runner.os == 'macOS' && 'mac' || 'win' }} --shot shot-source.png -- python app.py --no-window

      - name: Build
        run: python build.py

      - name: Smoke (built app, macOS)
        if: runner.os == 'macOS'
        run: |
          test -d dist/PostKit.app && test -f dist/PostKit-mac.zip
          codesign --verify --deep --strict dist/PostKit.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" dist/PostKit.app/Contents/Info.plist
          file dist/PostKit.app/Contents/MacOS/PostKit
          python tests/smoke.py --os mac --shot shot-app.png -- dist/PostKit.app/Contents/MacOS/PostKit --no-window

      - name: Smoke (built exe, Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python tests/smoke.py --os win --shot shot-app.png -- dist/PostKit.exe --no-window

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ runner.os }}
          path: shot-*.png
          if-no-files-found: ignore

      # 맥 .app 은 서명·공증 없이 시험용으로만 올려 둔다(릴리스는 release.py 로 따로)
      - name: Upload PostKit-mac.zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PostKit-mac
          path: dist/PostKit-mac.zip
          retention-days: 14
